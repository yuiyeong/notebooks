[project]
name = "notebooks"
version = "0.1.0"
description = ""
authors = [
    {name = "yuiyeong", email = "joyuiyeong@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "numpy (>=2.2.4,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "selenium (>=4.30.0,<5.0.0)",
    "webdriver-manager (>=4.0.2,<5.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "notion-client (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "notion2md (>=2.9.0,<3.0.0)",
    "markdownify (>=1.1.0,<2.0.0)",
    "finance-datareader (>=0.9.96,<0.10.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "torch (>=2.6.0,<3.0.0)",
    "torchvision (>=0.21.0,<0.22.0)",
    "torchaudio (>=2.6.0,<3.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "statsmodels (>=0.14.4,<0.15.0)",
    "ffmpeg-python (>=0.2.0,<0.3.0)",
    "openai-whisper (>=20250625,<20250626)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "html5lib (>=1.1,<2.0)",
    "langchain (>=0.3.27,<0.4.0)",
    "langchainhub (>=0.1.21,<0.2.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
    "langchain-core (>=0.3.74,<0.4.0)",
    "langchain-text-splitters (>=0.3.9,<0.4.0)",
    "langchain-ollama (>=0.3.7,<0.4.0)",
    "langchain-chroma (>=0.2.5,<0.3.0)",
    "docx2txt (>=0.9,<0.10)"
]

[project.optional-dependencies]
dev = [
    "ruff (>=0.12.9,<0.13.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "jupyterlab (>=4.4.6,<5.0.0)",
    "notebook (>=7.4.5,<8.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)"
]

[tool.poetry]
package-mode = false
packages = [ { include = "src" } ]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
